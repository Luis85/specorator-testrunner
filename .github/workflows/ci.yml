name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes any in-flight run; cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        # Also run the suite on Windows so the security-critical `cmd.exe` shim
        # branch in NodeChildProcessRunner (and the rest of the adapter) executes
        # on the real platform, not just via the injected-platform unit tests.
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build plugin bundle
        run: npm run build

      - name: Test (with coverage thresholds)
        run: npm run test:coverage

  # Blocking changed-code quality gate (fallow audit, TD-006 flip). The
  # verdict gates on findings INTRODUCED by the changeset (new-only
  # attribution), targeting regressions rather than pre-existing inventory —
  # but note: ANY edit to a file (even comment-only) brings that file's
  # findings into scope, where attribution can surface pre-existing
  # complexity (observed on PR #33). The verdict also lands in the job
  # summary.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The audit diffs against the merge-base with the PR base branch.
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fallow audit
        run: |
          set -o pipefail
          # GITHUB_BASE_REF is only set on pull_request events; on main pushes
          # fallow's own merge-base discovery applies (a no-op changeset).
          if [ -n "$GITHUB_BASE_REF" ]; then
            npx fallow audit --base "origin/$GITHUB_BASE_REF" --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          else
            npx fallow audit --format markdown | tee -a "$GITHUB_STEP_SUMMARY"
          fi
