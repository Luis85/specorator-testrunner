name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes any in-flight run; cancel the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
        # Also run the suite on Windows so the security-critical `cmd.exe` shim
        # branch in NodeChildProcessRunner (and the rest of the adapter) executes
        # on the real platform, not just via the injected-platform unit tests.
        include:
          - os: windows-latest
            node-version: 22
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build plugin bundle
        run: npm run build

      - name: Test (with coverage thresholds)
        run: npm run test:coverage
