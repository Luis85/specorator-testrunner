# Opt-in E2E smoke: installs the generated .testrunner for real and runs the
# demo test (scripts/e2e-smoke.mjs). Heavier than CI (npm install + Chromium
# download per OS), so it only runs on demand: manual dispatch or the
# `e2e-smoke` label on a PR.
name: E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# Heavy (Chromium download per OS) — a newer run on the same ref supersedes any
# in-flight one.
concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Runs on: manual dispatch; adding the `e2e-smoke` label itself (not any
    # other label landing while it happens to be present); or pushes/reopens on
    # a PR that already carries the label.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'e2e-smoke') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'e2e-smoke'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is in scope: both recent runner regressions (npm.cmd quoting,
        # install paths) were Windows-specific.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install plugin dependencies
        run: npm ci

      - name: Run E2E smoke
        run: node scripts/e2e-smoke.mjs
